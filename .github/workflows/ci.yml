name: BetterDiscord CI

on:
  push:
    branches: ["development"]
  pull_request:
    branches: ["development"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test

      - name: Lint code
        run: bun run lint

      - name: Check types
        run: bun run typecheck

      - name: Build asar
        run: bun run dist
        env:
          BRANCH_NAME: ${{github.head_ref || github.ref_name}}
          COMMIT_HASH: ${{github.sha}}

      # Only upload artifact on PR, otherwise it gets pushed to canary
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: ${{github.event_name == 'pull_request'}}
        with:
          if-no-files-found: error
          retention-days: 30
          archive: false
          path: |
            dist/betterdiscord.asar
            dist/checksum.txt

      # Update the canary tag on push to development
      - name: Update tag
        uses: richardsimko/update-tag@v2
        if: ${{github.event_name == 'push'}}
        with:
          tag_name: canary
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      # Update the canary release on push to development
      - name: Update canary release
        uses: softprops/action-gh-release@v3
        if: ${{github.event_name == 'push'}}
        with:
          prerelease: true
          name: BetterDiscord Canary
          body: This is the canary release for BetterDiscord automatically kept up to date using GitHub actions.
          tag_name: canary
          fail_on_unmatched_files: true
          path: |
            dist/betterdiscord.asar
            dist/checksum.txt
